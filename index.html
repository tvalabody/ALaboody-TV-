<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 العُبودي TV - Yacine Live</title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet"> 

<!-- مكتبات OvenPlayer و HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/ovenplayer/dist/ovenplayer.js"></script>

<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
  --blur: blur(15px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 15px;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
  z-index: -1;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

.header {
  text-align: center;
  padding: 20px;
  margin-bottom: 15px;
}

.header h1 {
  font-size: 2rem;
  background: linear-gradient(135deg, #fff 0%, #e2e8ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 5px;
}

.subtitle {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.9rem;
}

.player-section {
  margin-bottom: 20px;
  padding: 15px;
  display: none;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  color: white;
}

#player-wrapper {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}

.channels-section {
  padding: 15px;
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.channel-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 20px 15px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.channel-card:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

.channel-card.active-stream {
  border-color: var(--accent);
  background: rgba(247, 37, 133, 0.15);
}

.channel-name {
  font-weight: 700;
  color: white;
  font-size: 1rem;
}

.badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(67, 97, 238, 0.8);
  color: white;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 600;
}

.close-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  transition: 0.3s;
}

.close-btn:hover {
  background: rgba(247, 37, 133, 0.4);
}

.loading {
  text-align: center;
  padding: 30px;
  color: white;
  grid-column: 1 / -1;
}

.spinner {
  width: 30px;
  height: 30px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top: 3px solid white;
  border-radius: 50%;
  margin: 0 auto 10px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head> 

<body> 

<header class="header glass-panel">
  <h1>العُبودي TV</h1>
  <div class="subtitle">فك تشفير وبث Yacine TV المباشر عبر OvenPlayer</div>
</header> 

<section id="player-container" class="player-section glass-panel">
  <div class="player-header">
    <h3 id="current-channel-title">اسم القناة</h3>
    <button class="close-btn" onclick="closePlayer()">إغلاق المشغل ✕</button>
  </div>
  <div id="player-wrapper"></div>
</section>

<section class="channels-section glass-panel">
  <div id="channels" class="channels-grid">
    <div class="loading">
      <div class="spinner"></div>
      جاري فك تشفير وجلب القنوات...
    </div>
  </div>
</section>

<script>
let playerInstance = null;

// دالة فك التشفير بلغة JavaScript (XOR Decryption)
function decryptYacinePayload(base64Body, tHeader) {
  const binaryStr = atob(base64Body);
  const decodedBytes = new Uint8Array(binaryStr.length);
  for (let i = 0; i < binaryStr.length; i++) {
    decodedBytes[i] = binaryStr.charCodeAt(i);
  }

  const keyStr = "c!xZj+N9&G@Ev@vw" + (tHeader || Math.floor(Date.now() / 1000).toString());
  const keyEncoder = new TextEncoder();
  const keyBytes = keyEncoder.encode(keyStr);

  const plainBytes = new Uint8Array(decodedBytes.length);
  for (let i = 0; i < decodedBytes.length; i++) {
    plainBytes[i] = decodedBytes[i] ^ keyBytes[i % keyBytes.length];
  }

  const textDecoder = new TextDecoder('utf-8');
  let plainStr = textDecoder.decode(plainBytes);
  plainStr = plainStr.replace(/\\\//g, '/');
  return JSON.parse(plainStr);
}

// دالة جلب البيانات مع تخطي قيود الـ CORS
async function fetchYacineApi(apiUrl) {
  // استخدام وكيل لفك القيود وإرسال الـ Headers المطلوبة
  const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
  
  const response = await fetch(proxyUrl);
  const data = await response.json();
  
  const tHeader = Math.floor(Date.now() / 1000).toString();
  return decryptYacinePayload(data.contents.trim(), tHeader);
}

// تشغيل القناة في OvenPlayer
async function playChannel(channelId, channelName) {
  const container = document.getElementById('player-container');
  const title = document.getElementById('current-channel-title');
  
  container.style.display = 'block';
  title.textContent = `جاري استخراج السيرفر: ${channelName}...`;
  container.scrollIntoView({ behavior: 'smooth' });

  try {
    const streamInfo = await fetchYacineApi(`https://def.yacinelive.com/api/channel/${channelId}`);
    
    // استخراج رابط البث من مصفوفة السيرفرات المفكوكة
    let streamUrl = "";
    if (Array.isArray(streamInfo) && streamInfo.length > 0) {
      streamUrl = streamInfo[0].url || streamInfo[0].stream_url;
    } else if (streamInfo.url) {
      streamUrl = streamInfo.url;
    }

    if (!streamUrl) {
      alert("تعذر العثور على رابط بث نشط للقناة حالياً.");
      return;
    }

    title.textContent = `جاري التشغيل: ${channelName}`;

    if (playerInstance) {
      playerInstance.remove();
    }

    playerInstance = OvenPlayer.create('player-wrapper', {
      autoStart: true,
      controls: true,
      sources: [
        {
          type: 'hls',
          file: streamUrl,
          label: channelName
        }
      ]
    });
  } catch (error) {
    title.textContent = `خطأ أثناء تشغيل: ${channelName}`;
    console.error(error);
  }
}

function closePlayer() {
  if (playerInstance) {
    playerInstance.remove();
    playerInstance = null;
  }
  document.getElementById('player-container').style.display = 'none';
  document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-stream'));
}

// تحميل القنوات المتاحة
async function loadChannels() {
  const grid = document.getElementById('channels');
  try {
    // جلب القنوات لقناة beIN SPORTS 1 الافتراضية
    const defaultChannels = [
      { id: 1424, name: "beIN SPORTS 1" }
    ];

    grid.innerHTML = "";
    defaultChannels.forEach(ch => {
      const card = document.createElement("div");
      card.className = "channel-card";
      card.innerHTML = `
        <span class="badge">Live API</span>
        <div class="channel-name">${ch.name}</div>
      `;
      
      card.onclick = () => {
        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-stream'));
        card.classList.add('active-stream');
        playChannel(ch.id, ch.name);
      };

      grid.appendChild(card);
    });

  } catch (e) {
    grid.innerHTML = `<div class="loading">❌ فشل تحميل القنوات: ${e.message}</div>`;
  }
}

document.addEventListener('DOMContentLoaded', loadChannels);
</script>
</body>
</html>
