<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 العُبودي TV</title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet"> 

<!-- مكتبات OvenPlayer و HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/ovenplayer/dist/ovenplayer.js"></script>

<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
  --blur: blur(15px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 15px;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
  z-index: -1;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

.header {
  text-align: center;
  padding: 20px;
  margin-bottom: 15px;
}

.header h1 {
  font-size: 2rem;
  background: linear-gradient(135deg, #fff 0%, #e2e8ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 5px;
}

.subtitle {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.9rem;
}

.telegram-link {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 136, 204, 0.2);
  padding: 8px 16px;
  border-radius: 12px;
  color: white;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
}

.telegram-link:hover {
  background: rgba(0, 136, 204, 0.3);
  transform: translateY(-2px);
}

.player-section {
  margin-bottom: 20px;
  padding: 15px;
  display: none;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  color: white;
}

#player-wrapper {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}

.categories-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 5px;
  margin-bottom: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

.cat-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.9);
  padding: 8px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  transition: all 0.3s ease;
}

.cat-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(247, 37, 133, 0.4);
}

.channels-section {
  padding: 15px;
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}

.channel-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 20px 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  font-weight: 700;
  min-height: 80px;
}

.channel-card:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

.channel-card.active-stream {
  border-color: var(--accent);
  background: rgba(247, 37, 133, 0.25);
}

.close-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  transition: 0.3s;
}

.close-btn:hover {
  background: rgba(247, 37, 133, 0.4);
}

.status-msg {
  text-align: center;
  padding: 30px;
  color: white;
  grid-column: 1 / -1;
}

.spinner {
  width: 30px;
  height: 30px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top: 3px solid white;
  border-radius: 50%;
  margin: 0 auto 10px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head> 

<body> 

<header class="header glass-panel">
  <h1>العُبودي TV</h1>
  <div class="subtitle">بث مباشر لجميع باقات ياسين تيفي</div>
  <a href="https://t.me/stlaet1" class="telegram-link" target="_blank">
    <span>تابعونا على التلكرام</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.14.141-.259.259-.374.261l.213-3.053 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.136-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/>
    </svg>
  </a>
</header> 

<section id="player-container" class="player-section glass-panel">
  <div class="player-header">
    <h3 id="current-channel-title">اسم القناة</h3>
    <button class="close-btn" onclick="closePlayer()">✕ إغلاق</button>
  </div>
  <div id="player-wrapper"></div>
</section>

<div class="categories-bar" id="categories-bar"></div>

<section class="channels-section glass-panel">
  <div class="channels-grid" id="channels">
    <div class="status-msg">
      <div class="spinner"></div>
      جاري تحميل الأقسام والقنوات...
    </div>
  </div>
</section>

<script>
const BACKEND_ENDPOINT = "https://tvalabody--fcb765689de211f1ac711607ee4eb77e.web.val.run";

let playerInstance = null;

async function fetchFromBackend(path) {
  const res = await fetch(`${BACKEND_ENDPOINT}${path}`, {
    method: "GET",
    headers: { "Accept": "application/json" }
  });
  if (!res.ok) throw new Error(`كود الاستجابة: ${res.status}`);
  const result = await res.json();
  return result;
}

async function loadCategories() {
  const catBar = document.getElementById("categories-bar");
  const channelsGrid = document.getElementById("channels");

  try {
    const res = await fetchFromBackend("/api/categories");
    catBar.innerHTML = "";

    const list = Array.isArray(res) ? res : (res.data || []);

    list.forEach((cat, index) => {
      const btn = document.createElement("button");
      btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
      btn.textContent = cat.name || cat.title;
      btn.onclick = () => {
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        loadChannelsByCategory(cat.id);
      };
      catBar.appendChild(btn);
    });

    if (list.length > 0) {
      loadChannelsByCategory(list[0].id);
    }
  } catch (err) {
    channelsGrid.innerHTML = `
      <div class="status-msg">
        ⚠️ تعذر جلب الأقسام<br>
        <small style="opacity:0.7">${err.message}</small>
      </div>`;
  }
}

async function loadChannelsByCategory(catId) {
  const channelsGrid = document.getElementById("channels");
  channelsGrid.innerHTML = `<div class="status-msg"><div class="spinner"></div>جاري تحميل القنوات...</div>`;

  // قائمة بجميع مسارات قنوات الأقسام المحتملة في سيرفرات ياسين
  const endpoints = [
    `/api/categories/${catId}/channels`,
    `/api/category/${catId}/channels`,
    `/api/channels?category_id=${catId}`,
    `/api/channels/${catId}`
  ];

  let channels = [];
  let errorLog = "";

  for (const ep of endpoints) {
    try {
      const res = await fetchFromBackend(ep);
      const extracted = Array.isArray(res) ? res : (res.data || []);
      if (Array.isArray(extracted) && extracted.length > 0) {
        channels = extracted;
        break;
      }
    } catch (e) {
      errorLog = e.message;
    }
  }

  channelsGrid.innerHTML = "";

  if (!channels || channels.length === 0) {
    channelsGrid.innerHTML = `<div class="status-msg">لا توجد قنوات متاحة في هذا القسم أو تعذر قراءتها.</div>`;
    return;
  }

  channels.forEach(channel => {
    const card = document.createElement("div");
    card.className = "channel-card";
    card.textContent = channel.name || channel.title;
    card.onclick = () => {
      document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
      card.classList.add("active-stream");
      playChannel(channel.id, channel.name || channel.title);
    };
    channelsGrid.appendChild(card);
  });
}

async function playChannel(channelId, channelName) {
  const container = document.getElementById("player-container");
  const title = document.getElementById("current-channel-title");

  container.style.display = "block";
  title.textContent = `جاري استخراج رابط: ${channelName}...`;
  container.scrollIntoView({ behavior: "smooth" });

  try {
    const streamData = await fetchFromBackend(`/api/channel/${channelId}`);
    let streamUrl = "";
    
    if (Array.isArray(streamData) && streamData.length > 0) {
      streamUrl = streamData[0].url || streamData[0].stream_url;
    } else if (streamData.data && Array.isArray(streamData.data) && streamData.data.length > 0) {
      streamUrl = streamData.data[0].url || streamData.data[0].stream_url;
    } else if (streamData.url) {
      streamUrl = streamData.url;
    } else if (streamData.stream_url) {
      streamUrl = streamData.stream_url;
    }

    if (!streamUrl) throw new Error("رابط البث غير متوفر حالياً");

    title.textContent = `جاري التشغيل: ${channelName}`;

    if (playerInstance) playerInstance.remove();

    playerInstance = OvenPlayer.create("player-wrapper", {
      autoStart: true,
      controls: true,
      sources: [{ type: "hls", file: streamUrl, label: channelName }]
    });
  } catch (err) {
    title.textContent = `خطأ: تعذر تشغيل ${channelName}`;
  }
}

function closePlayer() {
  if (playerInstance) {
    playerInstance.remove();
    playerInstance = null;
  }
  document.getElementById("player-container").style.display = "none";
  document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
}

document.addEventListener("DOMContentLoaded", loadCategories);
</script>
</body>
</html>
