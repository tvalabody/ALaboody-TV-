<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
  --blur: blur(15px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 15px;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
  z-index: -1;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

.header {
  text-align: center;
  padding: 20px;
  margin-bottom: 15px;
}

.header h1 {
  font-size: 2rem;
  background: linear-gradient(135deg, #fff 0%, #e2e8ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 5px;
}

.subtitle {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.9rem;
}

.telegram-link {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 136, 204, 0.2);
  padding: 8px 16px;
  border-radius: 12px;
  color: white;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
}

.telegram-link:hover {
  background: rgba(0, 136, 204, 0.3);
  transform: translateY(-2px);
}

/* حاوية مشغل الفيديو OvenPlayer */
.player-section {
  margin-bottom: 20px;
  padding: 15px;
  display: none;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  color: white;
}

#player-wrapper {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}

.search-section {
  margin-bottom: 15px;
  padding: 15px;
}

.search-box {
  width: 100%;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  color: white;
  outline: none;
  transition: all 0.3s ease;
}

.search-box::placeholder {
  color: rgba(255, 255, 255, 0.6);
}

.search-box.focused {
  background: rgba(255, 255, 255, 0.15);
  border: 2px solid rgba(67, 97, 238, 0.6);
  box-shadow: 0 0 15px rgba(67, 97, 238, 0.3);
}

.filter-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 15px;
  justify-content: center;
}

.filter-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.9);
  padding: 8px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
  transition: all 0.3s ease;
}

.filter-btn.active, .filter-btn.focused {
  background: rgba(67, 97, 238, 0.3);
  border-color: rgba(67, 97, 238, 0.6);
  box-shadow: 0 0 10px rgba(67, 97, 238, 0.3);
}

.channels-section {
  padding: 15px;
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

/* بطاقة القناة النصية */
.channel-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 20px 15px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.channel-card:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

.channel-card.active-stream {
  border-color: var(--accent);
  background: rgba(247, 37, 133, 0.15);
}

.channel-card.focused {
  background: rgba(67, 97, 238, 0.2);
  border: 2px solid rgba(67, 97, 238, 0.6);
  transform: scale(1.03);
  box-shadow: 0 0 20px rgba(67, 97, 238, 0.4);
}

.channel-name {
  font-weight: 700;
  color: white;
  font-size: 1rem;
  margin-top: 10px;
}

.quality-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(67, 97, 238, 0.8);
  color: white;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 600;
}

.live-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(247, 37, 133, 0.8);
  color: white;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 600;
}

.group-header {
  grid-column: 1 / -1;
  font-size: 1.15rem;
  font-weight: 700;
  margin: 20px 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
}

.group-description {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.7);
  margin-top: 4px;
  font-weight: 300;
}

.loading {
  text-align: center;
  padding: 40px 20px;
  color: white;
  grid-column: 1 / -1;
}

.spinner {
  width: 30px;
  height: 30px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top: 3px solid white;
  border-radius: 50%;
  margin: 0 auto 15px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.no-results {
  text-align: center;
  padding: 30px;
  color: rgba(255, 255, 255, 0.6);
  grid-column: 1 / -1;
}

@media (max-width: 768px) {
  .channels-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .channels-grid {
    grid-template-columns: 1fr;
  }
}
</style>

let playerInstance = null;
let allChannels = [];
const searchInput = document.getElementById('search-input');

function initPlayer(streamUrl, channelName) {
  const container = document.getElementById('player-container');
  const title = document.getElementById('current-channel-title');
  
  container.style.display = 'block';
  title.textContent = `جاري التشغيل: ${channelName}`;
  container.scrollIntoView({ behavior: 'smooth' });

  if (playerInstance) {
    playerInstance.remove();
  }

  // تهيئة مشغل OvenPlayer
  playerInstance = OvenPlayer.create('player-wrapper', {
    autoStart: true,
    controls: true,
    sources: [
      {
        type: 'hls',
        file: streamUrl,
        label: channelName
      }
    ]
  });
}

function closePlayer() {
  if (playerInstance) {
    playerInstance.remove();
    playerInstance = null;
  }
  document.getElementById('player-container').style.display = 'none';
}

function loadChannels() {
  try {
    allChannels = channelsData;
    document.getElementById("loading").style.display = "none";
    createFilterButtons();
    displayChannels(allChannels);
    
    searchInput.addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      const filteredChannels = allChannels.filter(channel => 
        channel.name.toLowerCase().includes(searchTerm) || 
        channel.group.toLowerCase().includes(searchTerm)
      );
      displayChannels(filteredChannels);
    });

  } catch (e) {
    document.getElementById("loading").innerHTML = "❌ فشل تحميل القنوات";
  }
} 

function createFilterButtons() {
  const filterContainer = document.getElementById("filter-buttons");
  filterContainer.innerHTML = '';
  
  const categories = [...new Set(allChannels.map(ch => ch.category))];
  
  const allButton = document.createElement("button");
  allButton.className = "filter-btn active";
  allButton.textContent = "الكل";
  allButton.onclick = (e) => filterChannels("all", e.target);
  filterContainer.appendChild(allButton);
  
  categories.forEach(category => {
    const button = document.createElement("button");
    button.className = "filter-btn";
    button.textContent = category;
    button.onclick = (e) => filterChannels(category, e.target);
    filterContainer.appendChild(button);
  });
}

function filterChannels(category, targetBtn) {
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  if (targetBtn) targetBtn.classList.add('active');
  
  const filteredChannels = category === "all" 
    ? allChannels 
    : allChannels.filter(ch => ch.category === category);
  
  displayChannels(filteredChannels);
}

function displayChannels(channels) {
  const grid = document.getElementById("channels");
  grid.innerHTML = "";

  if (channels.length === 0) {
    grid.innerHTML = '<div class="no-results">لم يتم العثور على قنوات</div>';
    return;
  }

  const groupedChannels = {};
  channels.forEach(ch => {
    if (!groupedChannels[ch.group]) {
      groupedChannels[ch.group] = [];
    }
    groupedChannels[ch.group].push(ch);
  });

  for (const group in groupedChannels) {
    const groupHeader = document.createElement("div");
    groupHeader.className = "group-header";
    groupHeader.innerHTML = `<div>${group}</div>`;
    
    if (group === "بين سبورت مشتركين ايرثلنك") {
      groupHeader.innerHTML += `<div class="group-description">مخصصة لمشتركي شبكة ايرثلنك</div>`;
    }
    
    grid.appendChild(groupHeader);

    groupedChannels[group].forEach(channel => {
      const card = document.createElement("div");
      card.className = "channel-card";
      card.innerHTML = `
        <span class="quality-badge">${channel.quality}</span>
        <span class="live-badge">${channel.status}</span>
        <div class="channel-name">${channel.name}</div>
      `;
      
      card.onclick = () => {
        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-stream'));
        card.classList.add('active-stream');
        initPlayer(channel.url, channel.name);
      };

      grid.appendChild(card);
    });
  }
}

document.addEventListener('DOMContentLoaded', loadChannels);
