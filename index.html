<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📺 العُبودي TV</title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"> 

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
  --blur: blur(16px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
  padding: 12px;
  min-height: 100vh;
  color: white;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

.header {
  text-align: center;
  padding: 15px;
  margin-bottom: 12px;
}

.header h1 {
  font-size: 1.8rem;
  font-weight: 800;
  margin-bottom: 4px;
}

.subtitle {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.85rem;
}

.telegram-link {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #0088cc;
  padding: 6px 14px;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
}

.player-section {
  margin-bottom: 15px;
  padding: 12px;
  display: none;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.player-header h3 {
  font-size: 1rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#video-element {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  background: #000;
  display: block;
}

.categories-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  padding: 8px 4px;
  margin-bottom: 15px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.categories-bar::-webkit-scrollbar {
  display: none;
}

.cat-btn {
  display: inline-block;
  flex: 0 0 auto;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  transition: 0.2s;
}

.cat-btn.active {
  background: var(--accent);
  border-color: var(--accent);
}

.channels-section {
  padding: 12px;
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}

.channel-card {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  padding: 16px 8px;
  cursor: pointer;
  text-align: center;
  font-weight: 700;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 70px;
  transition: 0.2s;
}

.channel-card:active, .channel-card.active-stream {
  background: rgba(247, 37, 133, 0.3);
  border-color: var(--accent);
}

.close-btn {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 4px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-size: 0.8rem;
}

.status-msg {
  text-align: center;
  padding: 25px;
  grid-column: 1 / -1;
  font-size: 0.9rem;
}
</style>
</head> 

<body> 

<header class="header glass-panel">
  <h1>العُبودي TV</h1>
  <div class="subtitle">بث مباشر لجميع باقات ياسين تيفي</div>
  <a href="https://t.me/stlaet1" class="telegram-link" target="_blank">
    <span>تابعونا على التلكرام</span>
  </a>
</header> 

<section id="player-container" class="player-section glass-panel">
  <div class="player-header">
    <h3 id="current-channel-title">اسم القناة</h3>
    <button class="close-btn" onclick="closePlayer()">✕ إغلاق</button>
  </div>
  <video id="video-element" controls playsinline></video>
</section>

<div class="categories-bar" id="categories-bar"></div>

<section class="channels-section glass-panel">
  <div class="channels-grid" id="channels">
    <div class="status-msg">جاري تحميل الأقسام...</div>
  </div>
</section>

<script>
const BACKEND_ENDPOINT = "https://tvalabody--fcb765689de211f1ac711607ee4eb77e.web.val.run";

let hlsInstance = null;

async function fetchFromBackend(path) {
  const res = await fetch(`${BACKEND_ENDPOINT}${path}`);
  if (!res.ok) throw new Error(`Status: ${res.status}`);
  return await res.json();
}

async function loadCategories() {
  const catBar = document.getElementById("categories-bar");
  const channelsGrid = document.getElementById("channels");

  try {
    const res = await fetchFromBackend("/api/categories");
    catBar.innerHTML = "";

    const list = Array.isArray(res) ? res : (res.data || []);

    list.forEach((cat, index) => {
      const btn = document.createElement("button");
      btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
      btn.textContent = cat.name || cat.title;
      btn.onclick = () => {
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        loadChannelsByCategory(cat.id);
      };
      catBar.appendChild(btn);
    });

    if (list.length > 0) {
      loadChannelsByCategory(list[0].id);
    }
  } catch (err) {
    channelsGrid.innerHTML = `<div class="status-msg">⚠️ تعذر تحميل الأقسام: ${err.message}</div>`;
  }
}

async function loadChannelsByCategory(catId) {
  const channelsGrid = document.getElementById("channels");
  channelsGrid.innerHTML = `<div class="status-msg">جاري جلب القنوات...</div>`;

  const endpoints = [
    `/api/categories/${catId}/channels`,
    `/api/category/${catId}/channels`,
    `/api/channels?category_id=${catId}`,
    `/api/channels/${catId}`
  ];

  let channels = [];
  for (const ep of endpoints) {
    try {
      const res = await fetchFromBackend(ep);
      const extracted = Array.isArray(res) ? res : (res.data || []);
      if (Array.isArray(extracted) && extracted.length > 0) {
        channels = extracted;
        break;
      }
    } catch (e) {}
  }

  channelsGrid.innerHTML = "";

  if (!channels || channels.length === 0) {
    channelsGrid.innerHTML = `<div class="status-msg">لا توجد قنوات متاحة في هذا القسم.</div>`;
    return;
  }

  channels.forEach(channel => {
    const card = document.createElement("div");
    card.className = "channel-card";
    card.textContent = channel.name || channel.title;
    card.onclick = () => {
      document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
      card.classList.add("active-stream");
      playChannel(channel.id, channel.name || channel.title);
    };
    channelsGrid.appendChild(card);
  });
}

async function playChannel(channelId, channelName) {
  const container = document.getElementById("player-container");
  const title = document.getElementById("current-channel-title");
  const video = document.getElementById("video-element");

  container.style.display = "block";
  title.textContent = `جاري بدء البث: ${channelName}...`;
  container.scrollIntoView({ behavior: "smooth" });

  try {
    const streamData = await fetchFromBackend(`/api/channel/${channelId}`);
    let rawStreamUrl = "";
    
    if (Array.isArray(streamData) && streamData.length > 0) {
      rawStreamUrl = streamData[0].url || streamData[0].stream_url;
    } else if (streamData.data && Array.isArray(streamData.data) && streamData.data.length > 0) {
      rawStreamUrl = streamData.data[0].url || streamData.data[0].stream_url;
    } else if (streamData.url) {
      rawStreamUrl = streamData.url;
    } else if (streamData.stream_url) {
      rawStreamUrl = streamData.stream_url;
    }

    if (!rawStreamUrl) throw new Error("رابط البث غير متوفر");

    const proxiedStreamUrl = `${BACKEND_ENDPOINT}?stream=${encodeURIComponent(rawStreamUrl)}`;

    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }

    title.textContent = `🔴 بث مباشر: ${channelName}`;

    if (Hls.isSupported()) {
      hlsInstance = new Hls({
        liveSyncDurationCount: 3,
        liveMaxLatencyDurationCount: 6,
        maxBufferLength: 10,
        enableWorker: true
      });

      hlsInstance.loadSource(proxiedStreamUrl);
      hlsInstance.attachMedia(video);

      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        video.currentTime = video.duration || 0;
        video.play().catch(() => {});
      });

      hlsInstance.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            hlsInstance.startLoad();
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hlsInstance.recoverMediaError();
          } else {
            hlsInstance.destroy();
          }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = proxiedStreamUrl;
      video.play().catch(() => {});
    }
  } catch (err) {
    title.textContent = `خطأ في تشغيل ${channelName}`;
  }
}

function closePlayer() {
  const video = document.getElementById("video-element");
  video.pause();
  video.src = "";
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  document.getElementById("player-container").style.display = "none";
  document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
}

document.addEventListener("DOMContentLoaded", loadCategories);
</script>
</body>
</html>
