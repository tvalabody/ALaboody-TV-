<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 العُبودي TV - Yacine Live</title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"> 

<!-- مكتبات OvenPlayer و HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/ovenplayer/dist/ovenplayer.js"></script>

<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 15px;
  min-height: 100vh;
  color: white;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(15px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

.header {
  text-align: center;
  padding: 20px;
  margin-bottom: 15px;
}

.header h1 {
  font-size: 1.8rem;
  margin-bottom: 5px;
}

.player-section {
  margin-bottom: 20px;
  padding: 15px;
  display: none;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

#player-wrapper {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}

.categories-bar {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px 5px;
  margin-bottom: 15px;
}

.cat-btn {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 8px 16px;
  border-radius: 10px;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  transition: 0.3s;
}

.cat-btn.active {
  background: var(--accent);
  border-color: var(--accent);
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 15px;
}

.channel-card {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  padding: 18px 10px;
  cursor: pointer;
  transition: 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 80px;
  font-weight: 700;
}

.channel-card:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
}

.channel-card.active-stream {
  border-color: var(--accent);
  background: rgba(247, 37, 133, 0.25);
}

.close-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
}

.status-msg {
  text-align: center;
  padding: 30px;
  grid-column: 1 / -1;
  font-size: 1rem;
}
</style>
</head> 

<body> 

<header class="header glass-panel">
  <h1>📺 العُبودي TV</h1>
  <div>بث مباشر لجميع باقات ياسين تيفي</div>
</header> 

<section id="player-container" class="player-section glass-panel">
  <div class="player-header">
    <h3 id="current-channel-title">اسم القناة</h3>
    <button class="close-btn" onclick="closePlayer()">✕ إغلاق</button>
  </div>
  <div id="player-wrapper"></div>
</section>

<div class="categories-bar" id="categories-bar"></div>

<section class="glass-panel">
  <div class="channels-grid" id="channels">
    <div class="status-msg">جاري تحميل الأقسام والقنوات...</div>
  </div>
</section>

<script>
const BACKEND_ENDPOINT = "https://tvalabody-alabody.web.val.run";

let playerInstance = null;

async function fetchFromBackend(path) {
  const res = await fetch(`${BACKEND_ENDPOINT}${path}`);
  if (!res.ok) throw new Error(`خطأ في الاستجابة: ${res.status}`);
  return await res.json();
}

async function loadCategories() {
  const catBar = document.getElementById("categories-bar");
  const channelsGrid = document.getElementById("channels");

  try {
    const categories = await fetchFromBackend("/api/categories");
    catBar.innerHTML = "";

    categories.forEach((cat, index) => {
      const btn = document.createElement("button");
      btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
      btn.textContent = cat.name || cat.title;
      btn.onclick = () => {
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        loadChannelsByCategory(cat.id);
      };
      catBar.appendChild(btn);
    });

    if (categories.length > 0) {
      loadChannelsByCategory(categories[0].id);
    }
  } catch (err) {
    channelsGrid.innerHTML = `<div class="status-msg">⚠️ تعذر تحميل الأقسام: ${err.message}</div>`;
  }
}

async function loadChannelsByCategory(catId) {
  const channelsGrid = document.getElementById("channels");
  channelsGrid.innerHTML = `<div class="status-msg">جاري تحميل القنوات...</div>`;

  try {
    const channels = await fetchFromBackend(`/api/channels?category_id=${catId}`);
    channelsGrid.innerHTML = "";

    if (!channels || channels.length === 0) {
      channelsGrid.innerHTML = `<div class="status-msg">لا توجد قنوات متاحة في هذا القسم.</div>`;
      return;
    }

    channels.forEach(channel => {
      const card = document.createElement("div");
      card.className = "channel-card";
      card.textContent = channel.name;
      card.onclick = () => {
        document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
        card.classList.add("active-stream");
        playChannel(channel.id, channel.name);
      };
      channelsGrid.appendChild(card);
    });
  } catch (err) {
    channelsGrid.innerHTML = `<div class="status-msg">⚠️ فشل تحميل قنوات هذا القسم</div>`;
  }
}

async function playChannel(channelId, channelName) {
  const container = document.getElementById("player-container");
  const title = document.getElementById("current-channel-title");

  container.style.display = "block";
  title.textContent = `جاري استخراج وتشغيل: ${channelName}...`;
  container.scrollIntoView({ behavior: "smooth" });

  try {
    const streamData = await fetchFromBackend(`/api/channel/${channelId}`);
    let streamUrl = "";
    
    if (Array.isArray(streamData) && streamData.length > 0) {
      streamUrl = streamData[0].url || streamData[0].stream_url;
    } else if (streamData.url) {
      streamUrl = streamData.url;
    }

    if (!streamUrl) throw new Error("رابط البث غير متوفر حالياً");

    title.textContent = `جاري التشغيل: ${channelName}`;

    if (playerInstance) playerInstance.remove();

    playerInstance = OvenPlayer.create("player-wrapper", {
      autoStart: true,
      controls: true,
      sources: [{ type: "hls", file: streamUrl, label: channelName }]
    });
  } catch (err) {
    title.textContent = `خطأ: تعذر تشغيل ${channelName}`;
  }
}

function closePlayer() {
  if (playerInstance) {
    playerInstance.remove();
    playerInstance = null;
  }
  document.getElementById("player-container").style.display = "none";
  document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
}

document.addEventListener("DOMContentLoaded", loadCategories);
</script>
</body>
</html>
