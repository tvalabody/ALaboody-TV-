<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 العُبودي TV</title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet"> 

<!-- مكتبات OvenPlayer و HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/ovenplayer/dist/ovenplayer.js"></script>

<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
  --blur: blur(15px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 15px;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
  z-index: -1;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

.header {
  text-align: center;
  padding: 20px;
  margin-bottom: 15px;
}

.header h1 {
  font-size: 2rem;
  background: linear-gradient(135deg, #fff 0%, #e2e8ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 5px;
}

.subtitle {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.9rem;
}

.telegram-link {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 136, 204, 0.2);
  padding: 8px 16px;
  border-radius: 12px;
  color: white;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
}

.telegram-link:hover {
  background: rgba(0, 136, 204, 0.3);
  transform: translateY(-2px);
}

/* مشغل OvenPlayer */
.player-section {
  margin-bottom: 20px;
  padding: 15px;
  display: none;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  color: white;
}

#player-wrapper {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}

.search-section {
  margin-bottom: 15px;
  padding: 15px;
}

.search-box {
  width: 100%;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  color: white;
  outline: none;
  transition: all 0.3s ease;
}

.search-box::placeholder {
  color: rgba(255, 255, 255, 0.6);
}

.search-box.focused {
  background: rgba(255, 255, 255, 0.15);
  border: 2px solid rgba(67, 97, 238, 0.6);
  box-shadow: 0 0 15px rgba(67, 97, 238, 0.3);
}

.channels-section {
  padding: 15px;
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.channel-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 24px 15px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.channel-card:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

.channel-card.active-stream {
  border-color: var(--accent);
  background: rgba(247, 37, 133, 0.15);
}

.channel-name {
  font-weight: 700;
  color: white;
  font-size: 1.05rem;
  margin-top: 5px;
}

.quality-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(67, 97, 238, 0.8);
  color: white;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 600;
}

.live-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(247, 37, 133, 0.8);
  color: white;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 600;
}

.close-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  transition: 0.3s;
}

.close-btn:hover {
  background: rgba(247, 37, 133, 0.4);
}

.no-results {
  text-align: center;
  padding: 30px;
  color: rgba(255, 255, 255, 0.6);
  grid-column: 1 / -1;
}

@media (max-width: 768px) {
  .channels-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .channels-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head> 

<body> 

<header class="header glass-panel">
  <h1>العُبودي TV</h1>
  <div class="subtitle">بث مباشر - beIN SPORTS</div>
  <a href="https://t.me/stlaet1" class="telegram-link" target="_blank">
    <span>تابعونا على التلكرام</span>
  </a>
</header> 

<!-- مشغل القنوات -->
<section id="player-container" class="player-section glass-panel">
  <div class="player-header">
    <h3 id="current-channel-title">اسم القناة</h3>
    <button class="close-btn" onclick="closePlayer()">إغلاق المشغل ✕</button>
  </div>
  <div id="player-wrapper"></div>
</section>

<section class="search-section glass-panel">
  <input type="text" id="search-input" class="search-box" placeholder="ابحث عن قناة...">
</section>

<section class="channels-section glass-panel">
  <div class="channels-grid" id="channels"></div>
</section>

<script>
const channelsData = [
  {
    name: "بين سبورت 1",
    url: "https://go-tv.site/live/gotv/12345/41.m3u8",
    quality: "HD",
    status: "مباشر"
  },
  {
    name: "بين سبورت 2",
    url: "https://go-tv.site/live/gotv/12345/42.m3u8",
    quality: "HD",
    status: "مباشر"
  },
  {
    name: "بين سبورت 3",
    url: "https://go-tv.site/live/gotv/12345/43.m3u8",
    quality: "HD",
    status: "مباشر"
  },
  {
    name: "بين سبورت 4",
    url: "https://go-tv.site/live/gotv/12345/44.m3u8",
    quality: "HD",
    status: "مباشر"
  },
  {
    name: "بين سبورت 5",
    url: "https://go-tv.site/live/gotv/12345/45.m3u8",
    quality: "HD",
    status: "مباشر"
  }
];

let playerInstance = null;
const searchInput = document.getElementById('search-input');

function initPlayer(streamUrl, channelName) {
  const container = document.getElementById('player-container');
  const title = document.getElementById('current-channel-title');
  
  container.style.display = 'block';
  title.textContent = `جاري التشغيل: ${channelName}`;
  container.scrollIntoView({ behavior: 'smooth' });

  if (playerInstance) {
    playerInstance.remove();
  }

  playerInstance = OvenPlayer.create('player-wrapper', {
    autoStart: true,
    controls: true,
    sources: [
      {
        type: 'hls',
        file: streamUrl,
        label: channelName
      }
    ]
  });
}

function closePlayer() {
  if (playerInstance) {
    playerInstance.remove();
    playerInstance = null;
  }
  document.getElementById('player-container').style.display = 'none';
  document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-stream'));
}

function displayChannels(channels) {
  const grid = document.getElementById("channels");
  grid.innerHTML = "";

  if (channels.length === 0) {
    grid.innerHTML = '<div class="no-results">لم يتم العثور على قنوات</div>';
    return;
  }

  channels.forEach(channel => {
    const card = document.createElement("div");
    card.className = "channel-card";
    card.innerHTML = `
      <span class="quality">${channel.quality}</span>
      <span class="live-badge">${channel.status}</span>
      <div class="channel-name">${channel.name}</div>
    `;
    
    card.onclick = () => {
      document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-stream'));
      card.classList.add('active-stream');
      initPlayer(channel.url, channel.name);
    };

    grid.appendChild(card);
  });
}

function init() {
  displayChannels(channelsData);
  
  searchInput.addEventListener('input', function(e) {
    const searchTerm = e.target.value.toLowerCase();
    const filtered = channelsData.filter(ch => ch.name.toLowerCase().includes(searchTerm));
    displayChannels(filtered);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
