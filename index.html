<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📺 العُبودي TV</title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"> 

<!-- مكتبة Hls.js ومشغل ArtPlayer -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
  --blur: blur(16px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
  padding: 12px;
  min-height: 100vh;
  color: white;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

.header {
  text-align: center;
  padding: 15px;
  margin-bottom: 12px;
}

.header h1 {
  font-size: 1.8rem;
  font-weight: 800;
  margin-bottom: 4px;
}

.subtitle {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.85rem;
}

.telegram-link {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #0088cc;
  padding: 6px 14px;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
}

.player-section {
  margin-bottom: 15px;
  padding: 12px;
  display: none;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

#artplayer-container {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}

.servers-container {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.server-btn {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: white;
  padding: 5px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
}

.server-btn.active {
  background: var(--accent);
  border-color: var(--accent);
}

.categories-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  white-space: nowrap;
  padding: 8px 4px;
  margin-bottom: 15px;
  scrollbar-width: none;
}

.categories-bar::-webkit-scrollbar {
  display: none;
}

.cat-btn {
  display: inline-block;
  flex: 0 0 auto;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
}

.cat-btn.active {
  background: var(--accent);
  border-color: var(--accent);
}

.channels-section {
  padding: 12px;
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}

.channel-card {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  padding: 16px 8px;
  cursor: pointer;
  text-align: center;
  font-weight: 700;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 70px;
}

.channel-card.active-stream {
  background: rgba(247, 37, 133, 0.3);
  border-color: var(--accent);
}

.close-btn {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 4px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
}

.status-msg {
  text-align: center;
  padding: 25px;
  grid-column: 1 / -1;
  font-size: 0.9rem;
}
</style>
</head> 

<body> 

<header class="header glass-panel">
  <h1>العُبودي TV</h1>
  <div class="subtitle">بث مباشر لجميع باقات ياسين تيفي</div>
  <a href="https://t.me/stlaet1" class="telegram-link" target="_blank">
    <span>تابعونا على التلكرام</span>
  </a>
</header> 

<section id="player-container" class="player-section glass-panel">
  <div class="player-header">
    <h3 id="current-channel-title">اسم القناة</h3>
    <button class="close-btn" onclick="closePlayer()">✕ إغلاق</button>
  </div>
  <div id="artplayer-container"></div>
  <div class="servers-container" id="servers-list"></div>
</section>

<div class="categories-bar" id="categories-bar"></div>

<section class="channels-section glass-panel">
  <div class="channels-grid" id="channels">
    <div class="status-msg">جاري تحميل الأقسام...</div>
  </div>
</section>

<script>
const BACKEND_ENDPOINT = "https://tvalabody--fcb765689de211f1ac711607ee4eb77e.web.val.run";

let artInstance = null;

async function fetchFromBackend(path) {
  const res = await fetch(`${BACKEND_ENDPOINT}${path}`);
  if (!res.ok) throw new Error(`Status: ${res.status}`);
  return await res.json();
}

async function loadCategories() {
  const catBar = document.getElementById("categories-bar");
  const channelsGrid = document.getElementById("channels");

  try {
    const res = await fetchFromBackend("/api/categories");
    catBar.innerHTML = "";

    const list = Array.isArray(res) ? res : (res.data || []);

    list.forEach((cat, index) => {
      const btn = document.createElement("button");
      btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
      btn.textContent = cat.name || cat.title;
      btn.onclick = () => {
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        loadChannelsByCategory(cat.id);
      };
      catBar.appendChild(btn);
    });

    if (list.length > 0) {
      loadChannelsByCategory(list[0].id);
    }
  } catch (err) {
    channelsGrid.innerHTML = `<div class="status-msg">⚠️ تعذر تحميل الأقسام: ${err.message}</div>`;
  }
}

async function loadChannelsByCategory(catId) {
  const channelsGrid = document.getElementById("channels");
  channelsGrid.innerHTML = `<div class="status-msg">جاري جلب القنوات...</div>`;

  const endpoints = [
    `/api/categories/${catId}/channels`,
    `/api/category/${catId}/channels`,
    `/api/channels?category_id=${catId}`,
    `/api/channels/${catId}`
  ];

  let channels = [];
  for (const ep of endpoints) {
    try {
      const res = await fetchFromBackend(ep);
      const extracted = Array.isArray(res) ? res : (res.data || []);
      if (Array.isArray(extracted) && extracted.length > 0) {
        channels = extracted;
        break;
      }
    } catch (e) {}
  }

  channelsGrid.innerHTML = "";

  if (!channels || channels.length === 0) {
    channelsGrid.innerHTML = `<div class="status-msg">لا توجد قنوات متاحة في هذا القسم.</div>`;
    return;
  }

  channels.forEach(channel => {
    const card = document.createElement("div");
    card.className = "channel-card";
    card.textContent = channel.name || channel.title;
    card.onclick = () => {
      document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
      card.classList.add("active-stream");
      loadChannelStreams(channel.id, channel.name || channel.title);
    };
    channelsGrid.appendChild(card);
  });
}

async function loadChannelStreams(channelId, channelName) {
  const container = document.getElementById("player-container");
  const title = document.getElementById("current-channel-title");
  const serversDiv = document.getElementById("servers-list");

  container.style.display = "block";
  title.textContent = `جاري تجهيز سيرفرات: ${channelName}...`;
  serversDiv.innerHTML = "";
  container.scrollIntoView({ behavior: "smooth" });

  try {
    const data = await fetchFromBackend(`/api/channel/${channelId}`);
    title.textContent = `🔴 بث مباشر: ${channelName}`;

    let streamList = [];

    if (Array.isArray(data)) {
      streamList = data;
    } else if (data.data && Array.isArray(data.data)) {
      streamList = data.data;
    } else if (data.url || data.stream_url) {
      streamList = [{ name: "السيرفر الرئيسي", url: data.url || data.stream_url }];
    }

    if (streamList.length === 0) throw new Error("لم يتم العثور على سيرفرات للبث");

    streamList.forEach((st, idx) => {
      const targetUrl = st.url || st.stream_url;
      if (!targetUrl) return;

      const btn = document.createElement("button");
      btn.className = `server-btn ${idx === 0 ? 'active' : ''}`;
      btn.textContent = st.name || st.quality || `سيرفر ${idx + 1}`;
      btn.onclick = () => {
        document.querySelectorAll(".server-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        startArtPlayer(targetUrl);
      };
      serversDiv.appendChild(btn);
    });

    const firstUrl = streamList[0].url || streamList[0].stream_url;
    if (firstUrl) startArtPlayer(firstUrl);

  } catch (err) {
    title.textContent = `خطأ: ${err.message}`;
  }
}

function startArtPlayer(rawUrl) {
  const proxiedStreamUrl = `${BACKEND_ENDPOINT}?stream=${encodeURIComponent(rawUrl)}`;

  if (artInstance) {
    artInstance.destroy(true);
    artInstance = null;
  }

  artInstance = new Artplayer({
    container: '#artplayer-container',
    url: proxiedStreamUrl,
    type: 'm3u8',
    isLive: true,
    autoplay: true,
    autoMini: true,
    fullscreen: true,
    fullscreenWeb: true,
    playsInline: true,
    customType: {
      m3u8: function (video, url) {
        if (Hls.isSupported()) {
          if (artInstance && artInstance.hls) {
            artInstance.hls.destroy();
          }
          const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true
          });
          hls.loadSource(url);
          hls.attachMedia(video);
          artInstance.hls = hls;
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
        }
      },
    },
  });
}

function closePlayer() {
  if (artInstance) {
    if (artInstance.hls) {
      artInstance.hls.destroy();
    }
    artInstance.destroy(true);
    artInstance = null;
  }
  document.getElementById("player-container").style.display = "none";
  document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
}

document.addEventListener("DOMContentLoaded", loadCategories);
</script>
</body>
</html>
