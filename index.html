<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📺 العُبودي TV</title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"> 

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
  --blur: blur(16px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
  padding: 12px;
  min-height: 100vh;
  color: white;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

.header { text-align: center; padding: 15px; margin-bottom: 12px; }
.header h1 { font-size: 1.8rem; font-weight: 800; }
.subtitle { color: rgba(255, 255, 255, 0.8); font-size: 0.85rem; }
.telegram-link {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #0088cc;
  padding: 6px 14px;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
}

.player-section { margin-bottom: 15px; padding: 12px; display: none; }
.player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
#artplayer-container { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; }
.servers-container { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.server-btn {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: white;
  padding: 5px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Cairo';
  font-size: 0.8rem;
}
.server-btn.active { background: var(--accent); border-color: var(--accent); }

.categories-bar { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; padding: 8px 4px; margin-bottom: 15px; }
.cat-btn {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-family: 'Cairo';
  font-weight: 700;
}
.cat-btn.active { background: var(--accent); }

.channels-section { padding: 12px; }
.channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.channel-card {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  padding: 16px 8px;
  cursor: pointer;
  text-align: center;
  font-weight: 700;
}
.channel-card.active-stream { background: rgba(247, 37, 133, 0.3); border-color: var(--accent); }
.close-btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 4px 10px; border-radius: 8px; cursor: pointer; }
</style>
</head> 

<body> 

<header class="header glass-panel">
  <h1>العُبودي TV</h1>
  <div class="subtitle">بث مباشر سحابي فائق السرعة ومحمي</div>
  <a href="https://t.me/stlaet1" class="telegram-link" target="_blank">تابعونا على التلكرام</a>
</header> 

<section id="player-container" class="player-section glass-panel">
  <div class="player-header">
    <h3 id="current-channel-title">اسم القناة</h3>
    <button class="close-btn" onclick="closePlayer()">✕ إغلاق</button>
  </div>
  <div id="artplayer-container"></div>
  <div class="servers-container" id="servers-list"></div>
</section>

<div class="categories-bar" id="categories-bar"></div>

<section class="channels-section glass-panel">
  <div class="channels-grid" id="channels"></div>
</section>

<script>
const PROXY_WORKER = "https://yacine-proxy.hsinnzaer5.workers.dev";
const CLIENT_TOKEN = "Aboody_VIP_2026";

const OFFLINE_CATEGORIES = [
  {
    id: "bein",
    name: "beIN SPORTS",
    channels: [
      { id: 1, name: "beIN SPORTS 1" },
      { id: 2, name: "beIN SPORTS 2" },
      { id: 3, name: "beIN SPORTS 3" },
      { id: 4, name: "beIN SPORTS 4" },
      { id: 5, name: "beIN SPORTS 5" },
      { id: 6, name: "beIN SPORTS 6" },
      { id: 7, name: "beIN SPORTS 7" },
      { id: 8, name: "beIN SPORTS 8" },
      { id: 9, name: "beIN SPORTS 9" },
      { id: 10, name: "beIN SPORTS XTRA 1" },
      { id: 11, name: "beIN SPORTS XTRA 2" }
    ]
  },
  {
    id: "ssc",
    name: "SSC SPORTS",
    channels: [
      { id: 21, name: "SSC 1 HD" },
      { id: 22, name: "SSC 2 HD" },
      { id: 23, name: "SSC 3 HD" },
      { id: 24, name: "SSC 4 HD" },
      { id: 25, name: "SSC 5 HD" }
    ]
  },
  {
    id: "alkass",
    name: "قنوات الكأس",
    channels: [
      { id: 31, name: "Alkass ONE HD" },
      { id: 32, name: "Alkass TWO HD" },
      { id: 33, name: "Alkass THREE HD" },
      { id: 34, name: "Alkass FOUR HD" }
    ]
  }
];

let artInstance = null;
let currentHls = null;

function loadStaticCategories() {
  const catBar = document.getElementById("categories-bar");
  catBar.innerHTML = "";

  OFFLINE_CATEGORIES.forEach((cat, index) => {
    const btn = document.createElement("button");
    btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
    btn.textContent = cat.name;
    btn.onclick = () => {
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderChannels(cat.channels);
    };
    catBar.appendChild(btn);
  });

  renderChannels(OFFLINE_CATEGORIES[0].channels);
}

function renderChannels(channels) {
  const grid = document.getElementById("channels");
  grid.innerHTML = "";

  channels.forEach(channel => {
    const card = document.createElement("div");
    card.className = "channel-card";
    card.textContent = channel.name;
    card.onclick = () => {
      document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
      card.classList.add("active-stream");
      loadChannel(channel.id, channel.name);
    };
    grid.appendChild(card);
  });
}

async function loadChannel(channelId, channelName) {
  const container = document.getElementById("player-container");
  const title = document.getElementById("current-channel-title");
  const serversDiv = document.getElementById("servers-list");

  container.style.display = "block";
  title.textContent = `جاري الاتصال بـ: ${channelName}...`;
  serversDiv.innerHTML = "";
  container.scrollIntoView({ behavior: "smooth" });

  try {
    const res = await fetch(`${PROXY_WORKER}/api/channel/${channelId}`);
    const data = await res.json();

    let streamList = [];
    if (Array.isArray(data)) {
      streamList = data;
    } else if (data.data && Array.isArray(data.data)) {
      streamList = data.data;
    } else if (data.url || data.stream_url) {
      streamList = [{ name: "السيرفر الرئيسي", url: data.url || data.stream_url }];
    }

    if (streamList.length === 0) throw new Error("السيرفرات غير متوفرة حالياً");

    title.textContent = `🔴 بث مباشر: ${channelName}`;

    streamList.forEach((st, idx) => {
      const targetUrl = st.url || st.stream_url;
      if (!targetUrl) return;

      const btn = document.createElement("button");
      btn.className = `server-btn ${idx === 0 ? 'active' : ''}`;
      btn.textContent = st.name || st.quality || `سيرفر ${idx + 1}`;
      btn.onclick = () => {
        document.querySelectorAll(".server-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        startArtPlayer(targetUrl);
      };
      serversDiv.appendChild(btn);
    });

    const firstUrl = streamList[0].url || streamList[0].stream_url;
    if (firstUrl) startArtPlayer(firstUrl);

  } catch (err) {
    title.textContent = `خطأ: ${err.message}`;
  }
}

function startArtPlayer(rawUrl) {
  const proxiedStreamUrl = `${PROXY_WORKER}?stream=${encodeURIComponent(rawUrl)}&token=${CLIENT_TOKEN}`;

  if (currentHls) {
    currentHls.stopLoad();
    currentHls.detachMedia();
    currentHls.destroy();
    currentHls = null;
  }

  if (artInstance) {
    if (artInstance.video) {
      artInstance.video.pause();
      artInstance.video.removeAttribute('src');
      artInstance.video.load();
    }
    artInstance.destroy(true);
    artInstance = null;
  }

  const container = document.getElementById('artplayer-container');
  container.innerHTML = "";

  artInstance = new Artplayer({
    container: '#artplayer-container',
    url: proxiedStreamUrl,
    type: 'm3u8',
    isLive: true,
    autoplay: true,
    fullscreen: true,
    fullscreenWeb: true,
    customType: {
      m3u8: function (video, url) {
        if (Hls.isSupported()) {
          const hls = new Hls({
            enableWorker: true,
            maxBufferLength: 8,
            maxMaxBufferLength: 16
          });

          hls.loadSource(url);
          hls.attachMedia(video);
          currentHls = hls;

          hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                hls.startLoad();
              } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hls.recoverMediaError();
              } else {
                hls.destroy();
              }
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
        }
      },
    },
  });
}

function closePlayer() {
  if (currentHls) {
    currentHls.stopLoad();
    currentHls.detachMedia();
    currentHls.destroy();
    currentHls = null;
  }
  if (artInstance) {
    if (artInstance.video) {
      artInstance.video.pause();
      artInstance.video.removeAttribute('src');
      artInstance.video.load();
    }
    artInstance.destroy(true);
    artInstance = null;
  }
  document.getElementById("player-container").style.display = "none";
  document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
}

document.addEventListener("DOMContentLoaded", loadStaticCategories);
</script>
</body>
</html>
